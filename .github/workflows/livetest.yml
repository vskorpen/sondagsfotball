name: livetest
on: { push: { branches: [main], paths: ['.github/workflows/livetest.yml'] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            p.on('console', m => console.log('console:', m.text()));
            await p.goto('https://vskorpen.github.io/sondagsfotball/'); await p.waitForTimeout(2500);
            console.log('when:', await p.textContent('#when'));
            console.log('img ok:', await p.evaluate(() => document.querySelector('.hero').naturalWidth));
            await p.fill('#name', 'Testspiller'); await p.click('#yes');
            await p.waitForFunction(() => /Supert|galt/.test(document.querySelector('#msg').textContent), null, { timeout: 20000 });
            console.log('msg:', await p.textContent('#msg'));
            const p2 = await (await b.newContext()).newPage(); await p2.goto('https://vskorpen.github.io/sondagsfotball/'); await p2.waitForTimeout(2500);
            console.log('other visitor sees:', await p2.textContent('#inList'));
            await b.close();
          })();
          JS
          node t.js
          U=$(curl -s https://vskorpen.github.io/sondagsfotball/store.json | jq -r .url)
          curl -sS -X POST -H 'Content-Type: text/plain' --data-binary '{"week":null,"players":[]}' "$U"; echo; echo "after cleanup:"; curl -sS "$U"
