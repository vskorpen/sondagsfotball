name: livetest
on: { push: { branches: [main], paths: ['.github/workflows/livetest.yml'] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=$(curl -s https://vskorpen.github.io/sondagsfotball/store.json | jq -r .url)
          echo "before:"; curl -sS "$U"; echo
          curl -sS -X POST -H 'Content-Type: text/plain' --data-binary "{\"week\":\"2026-10-11\",\"players\":[{\"name\":\"Vetle\",\"status\":\"in\",\"ts\":$(date +%s%3N)}]}" "$U"; echo
          echo "after:"; curl -sS "$U"
