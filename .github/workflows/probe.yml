name: probe
on: { push: { branches: [main], paths: ['.github/workflows/probe.yml'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B='{"week":"2026-10-11","players":[]}'
          U=https://textdb.dev/api/data/probe-$RANDOM$RANDOM
          echo "== text/plain + Origin"; curl -sS -D - -o /dev/null -X POST -H 'Origin: https://vskorpen.github.io' -H "Content-Type: text/plain" --data-binary "$B" $U | grep -iE '^HTTP|access-control-allow-origin'
          curl -sS $U; echo
          echo "== charset"; curl -sS -o /dev/null -w '%{http_code}\n' -X POST -H "Content-Type: text/plain;charset=UTF-8" --data-binary "$B" $U
