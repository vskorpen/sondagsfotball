name: probe
on: { push: { branches: [main], paths: ['.github/workflows/probe.yml'] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=probe-$RANDOM$RANDOM; U=https://textdb.dev/api/data/$K
          curl -sS -w ' %{http_code}\n' -X POST -H 'Content-Type: text/plain;charset=UTF-8' -H 'Origin: https://vskorpen.github.io' --data-binary '{"week":"2026-10-11","players":[{"name":"Øyvind Æsø","status":"in","ts":1}]}' $U
          echo "GET:"; curl -sS $U; echo
          curl -sS -X POST -H 'Content-Type: text/plain' --data-binary '' $U; echo "after empty:"; curl -sS $U; echo
