name: Opprett delt liste

# Lager en tom, delt liste på jsonblob.com første gang og lagrer adressen i store.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create blob if missing
        run: |
          if [ -f store.json ]; then
            url=$(jq -r .url store.json)
            echo "store.json finnes: $url"
            curl -fsS -H 'Accept: application/json' "$url"
            exit 0
          fi
          resp=$(curl -sS -D headers.txt -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"week":null,"players":[]}' https://jsonblob.com/api/jsonBlob)
          echo "--- headers"; cat headers.txt; echo "--- body"; echo "$resp"
          loc=$(tr -d '\r' < headers.txt | awk 'tolower($1)=="location:"{print $2}' | tail -1)
          id=$(basename "${loc:-}")
          [ -z "$id" ] && id=$(echo "$resp" | jq -r '.id // empty' 2>/dev/null || true)
          [ -z "$id" ] && id=$(tr -d '\r' < headers.txt | awk 'tolower($1)=="x-jsonblob-id:"{print $2}' | tail -1)
          [ -n "$id" ] || { echo "Fant ingen blob-id"; exit 1; }
          url="https://jsonblob.com/api/jsonBlob/$id"
          echo "Ny liste: $url"
          curl -fsS -H 'Accept: application/json' "$url" | jq -e '.players' >/dev/null || { echo "Lista svarer ikke med JSON"; exit 1; }
          # sjekk CORS for nettleseren
          curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://vskorpen.github.io' \
            -H 'Access-Control-Request-Method: PUT' -H 'Access-Control-Request-Headers: content-type' "$url"
          jq -n --arg url "$url" '{url:$url}' > store.json
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add store.json
          git commit -m "Opprett delt liste"
          git push
